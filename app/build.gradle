plugins { id 'com.android.application' }

def signingFile = rootProject.file('.signing/tongjitap.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'org.hachile.tongjitap'
    compileSdk 36
    defaultConfig {
        applicationId 'org.hachile.tongjitap'
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName '1.0.0'
        testInstrumentationRunner 'org.hachile.tongjitap.DeviceChecks'
    }
    buildFeatures { buildConfig true }
    bundle { language { enableSplit = false } }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/tongjitap.jks')
                storePassword signing.getProperty('storePassword')
                keyAlias 'tongjitap'
                keyPassword signing.getProperty('storePassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
