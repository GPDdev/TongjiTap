plugins { id 'com.android.application' }

def signingFile = rootProject.file('.signing/tongjitap.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'org.hachile.tongjitap'
    compileSdk 36
    defaultConfig {
        applicationId 'org.hachile.tongjitap'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.2.1'
        testInstrumentationRunner 'org.hachile.tongjitap.DeviceChecks'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/tongjitap.jks')
                storePassword signing.getProperty('storePassword')
                keyAlias 'tongjitap'
                keyPassword signing.getProperty('storePassword')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true; checkReleaseBuilds true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
